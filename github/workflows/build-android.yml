name: Compilar Kong's Quest Android v0.8
on:
  push:
    paths:
      - 'Kongs-Quest-Android-v08.zip'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extrair projeto v0.8
        shell: bash
        run: |
          set -euo pipefail
          test -s Kongs-Quest-Android-v08.zip
          unzip -q -o Kongs-Quest-Android-v08.zip
          test -s project/build_android.sh
          test -s work/core/journey.cpp
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias Android oficiais
        run: python3 project/fetch_dependencies.py
      - name: Compilar nucleo Snes9x ARM64 e APK
        run: bash project/build_android.sh
      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail
          apk=Donkey-Kong-Country-Kongs-Quest-Android-v08-Experimental.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libsnes9x_jornada.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libjornada_player.so'
          unzip -l "$apk" | grep -F 'classes.dex'
          work/android/android-15/apksigner verify --verbose "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kongs-Quest-Android-v08-Experimental
          path: |
            Donkey-Kong-Country-Kongs-Quest-Android-v08-Experimental.apk
            SHA256SUMS.txt
          retention-days: 7
