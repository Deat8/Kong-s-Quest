name: Kong's Quest - Windows (sem Android)

on:
  push:
    paths:
      - 'Kongs-Quest-Windows-v09-Completo.zip'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar compilador Windows x64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            unzip
            file
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Extrair kit completo Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -s Kongs-Quest-Windows-v09-Completo.zip
          mkdir -p source portable
          unzip -q Kongs-Quest-Windows-v09-Completo.zip -d source
          test -f source/work/core/libretro/Makefile
          test -f source/work/core/journey.cpp
          test -s source/KongQuest-Windows.exe
          test -s source/work/core/LICENSE

      - name: Compilar Snes9x modificado (DLL para Windows)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -C source/work/core/libretro -j4 platform=win CC=gcc CXX=g++ AR=ar
          test -s source/work/core/libretro/snes9x_libretro.dll
          file source/work/core/libretro/snes9x_libretro.dll

      - name: Montar versao portatil
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cp source/KongQuest-Windows.exe portable/
          cp source/work/core/libretro/snes9x_libretro.dll portable/
          cp source/work/core/LICENSE portable/LICENSE-Snes9x.txt
          cp source/LEIA-ME-WINDOWS.txt portable/
          objdump -p portable/snes9x_libretro.dll > deps.txt
          for dll in libwinpthread-1.dll libstdc++-6.dll libgcc_s_seh-1.dll; do
            if grep -iq "DLL Name: $dll" deps.txt; then
              test -s "/mingw64/bin/$dll"
              cp "/mingw64/bin/$dll" portable/
            fi
          done
          file portable/KongQuest-Windows.exe | grep 'PE32+'
          file portable/snes9x_libretro.dll | grep 'PE32+'
          (cd portable && sha256sum * > SHA256SUMS.txt)

      - name: Testar carregamento da DLL no Windows
        shell: pwsh
        run: |
          @'
          import ctypes, pathlib, os
          d = pathlib.Path('portable').resolve()
          os.add_dll_directory(str(d))
          lib = ctypes.CDLL(str(d / 'snes9x_libretro.dll'))
          lib.retro_api_version.restype = ctypes.c_uint
          assert lib.retro_api_version() == 1
          print('OK: DLL de Windows carregada; Libretro API 1')
          '@ | python -

      - name: Publicar programa Windows
        uses: actions/upload-artifact@v4
        with:
          name: Kongs-Quest-Windows-x64-v09-Experimental
          path: portable/
          retention-days: 14